version: "v0.4"

project:
  name: "How Many Prime Factors Could a Counterexample to Giuga's Conjecture Have?"
  description: >-
    Lean 4 (v4.35.0) + Mathlib formalization of structural theorems, edge-dual
    linear-programming relaxations (Lemma W and refinements), Lemma C, local
    obstruction rules, unconditional counterexample lower bounds, explicit
    ceiling witnesses, and conditional transfer theorems for Giuga's conjecture
    (1950). Across 21 compared theorems (zero sorry, zero native_decide,
    standard axioms only), Lean 4 proves unconditionally that every Giuga
    counterexample has at least 578 distinct prime factors and exceeds 10^1803
    (at least 1,804 decimal digits), constructs an explicit 8,135-prime normal
    odd prime set (40,733 digits) and an explicit 8,138-prime witness
    satisfying all seven local counterexample rules (40,751 digits), proves all
    forms of Lemma W, Lemma C, and the mod-8 count congruence, and proves
    conditional lifting theorems reaching >= 8,138 prime factors and > 10^40747
    (>= 40,748 decimal digits) from explicit depth-6 frontier hypotheses.
    Main results in the companion paper: 0 of 2 headline theorems purely in
    Lean 4 (0%) · 2 of 2 by Lean 4 + external exact-integer certificates (all
    15 prefixes below 17). Existence of a Giuga counterexample remains open.
    Companion working paper, exact integer checker, and prior-work search log:
    https://mathdiscoveries.org/results/giuga.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

