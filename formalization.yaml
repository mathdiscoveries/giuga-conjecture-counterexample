status:
  scope: >-
    Unconditionally proved in Lean 4 (v4.35.0) + Mathlib with standard axioms
    only (zero sorry, zero native_decide, 128 axiom-audited declarations across
    Giuga/Verify.lean, 21 compared theorems in Challenge.lean / Solution.lean):
    (1) unconditional counterexample lower bounds >= 575 primes for normal odd
    prime sets with sum(1/p) > 1, >= 578 distinct prime factors, and
    n > 10^1803 (>= 1,804 decimal digits) for every Giuga counterexample;
    (2) unconditional pure-kernel explicit witnesses for an 8,135-prime normal
    odd prime set (10^40732 < prod G < 10^40733) and an 8,138-prime witness
    satisfying all seven local Giuga rules simultaneously
    (10^40750 < prod W < 10^40751);
    (3) unconditional proofs of Lemma W (Form E count and product bounds,
    Complete Frontier theorem, Refinement 2 strict log bound, Route (a) K7
    linear lift), Lemma C (general form), the unconditional 8,135th odd prime
    lower bound (>= 83,341), and all local obstruction rules (quadratic
    reciprocity mod 4, residue mod 8, exactness at v = 1, and mod-8 count
    congruence m = v + 1 mod 8);
    (4) five explicitly parameterized conditional transfer theorems deriving
    Lemma C >= 91,476 primes (and > 10^446177) for v >= 2, >= 8,138 prime
    factors and > 10^36083 from hN1 alone, and > 10^40747 (>= 40,748 digits)
    from hN1 plus the depth-6 Route (a) frontier certificate hypotheses.
    Not discharged inside Lean: the 15-leaf depth-6 exact-integer dual
    certificates for hN1 (N_1 >= 8,135) and Route (a) (> 10^40747), which are
    verified externally by the deterministic exact-integer checker accompanying
    the companion paper. Main results in companion paper: 0 of 2 headline
    theorems purely in Lean 4 (0%) · 2 of 2 by Lean 4 + exact integer
    certificates.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

