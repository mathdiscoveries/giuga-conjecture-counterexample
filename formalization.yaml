fidelity:
  divergences: >-
    The companion paper's two headline numerical theorems (>= 8,138 distinct
    prime divisors and >= 40,748 decimal digits; exact normal-set minimum
    8,135 primes / 40,733 digits) combine the Lean-verified structural
    theorems, ceiling witnesses, and transfer rules with external exact-integer
    dual certificates across all 15 normal prefixes below 17. Inside Lean 4
    alone, the unconditional counterexample lower bounds are >= 578 distinct
    prime factors and n > 10^1803 (via a 2-leaf depth-2 kernel certificate),
    both ceiling witnesses (8,135 primes / 40,733 digits and 8,138 primes /
    40,751 digits) are 100% unconditional, and the 8,138-prime / 36,084-digit /
    40,748-digit theorems carry their frontier certificate hypotheses (hN1 and
    hTailK/hCert) explicitly in their Lean types.

review:
  status: agent-reviewed
  reviewers:
    - "Internal adversarial falsifier and cross-model referee agents"
  notes: >-
    Checked by separate internal falsifier and referee agents and audited for
    standard axioms only across all 128 declarations via Giuga/Verify.lean.
    Independent mechanical Lean checking and automated editorial review are
    recorded in Palomar's report. No human mathematician has yet refereed the
    proof.

